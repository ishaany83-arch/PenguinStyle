<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Game Proxy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 1rem;
    }

    .form-container {
      width: 100%;
      max-width: 800px;
      margin-bottom: 2rem;
    }

    form {
      display: flex;
      gap: 0.75rem;
      background: #1e293b;
      padding: 0.5rem;
      border-radius: 12px;
      border: 1px solid #334155;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    input[type="url"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: #38bdf8;
    }

    button {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .game-container {
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      text-align: center;
      padding: 1rem;
      pointer-events: none;
    }

    .placeholder svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      stroke: #475569;
    }
  </style>
</head>
<body>
  <header>
    <h1>Web Game Tunnel</h1>
    <p class="subtitle">Lightweight, unrestricted proxy container for web-based gaming assets</p>
  </header>

  <div class="form-container">
    <form id="proxyForm">
      <input
        type="url"
        id="targetUrl"
        placeholder="Enter game asset or target URL (e.g. https://example.com/game)"
        required
      />
      <button type="submit">Launch Game</button>
    </form>
  </div>

  <div class="game-container">
    <div id="placeholder" class="placeholder">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 0 1 0 .656l-5.603 3.113a.375.375 0 0 1-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112Z" />
      </svg>
      <p>Enter a URL above and click "Launch Game" to load in widescreen view.</p>
    </div>
    <iframe id="gameFrame" src="about:blank" allowfullscreen></iframe>
  </div>

  <script>
    const form = document.getElementById('proxyForm');
    const input = document.getElementById('targetUrl');
    const iframe = document.getElementById('gameFrame');
    const placeholder = document.getElementById('placeholder');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const rawUrl = input.value.trim();
      if (!rawUrl) return;

      const proxyUrl = '/game-tunnel?url=' + encodeURIComponent(rawUrl);
      placeholder.style.display = 'none';
      iframe.src = proxyUrl;
    });
  </script>
</body>
</html>
